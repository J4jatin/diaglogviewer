name: DiagLogViewer CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov jinja2
          # Qt not available in CI headless env — install core only
          pip install matplotlib

      - name: Compile C++ CAN frame parser
        run: |
          cd parser
          g++ -O2 -std=c++17 -o can_frame_parser can_frame_parser.cpp
          echo "C++ parser compiled successfully"

      - name: Run tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: coverage.xml
